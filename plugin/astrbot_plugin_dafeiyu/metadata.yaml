name: astrbot_plugin_dafeiyu
display_name: 大肥鱼工具箱
short_desc: 让机器人在群里更像个群友：表情包复读、分清在跟谁说、回短点、说话习惯自检（主要按微信适配）
desc: 让机器人在群里更像个群友：图片复读（微信上发成会动、按表情大小显示的表情）、分清引用它又 @ 别人时在跟谁说、群里回短点、每天自检说话习惯；还有表情转换与收信翻译、拍一拍、新人欢迎、平台提示，以及发照片、唱歌、发语音工具，外加从 AstrNa 搬来的过场白隐藏、工具历史压缩、输出字数限制（默认关）。主要按微信适配（配合 astrbot-mac-wechat-connector），QQ 也能用；每个功能都在插件配置里单独开关；想让机器人只在几个群里说话，可以打开「只回私聊」（默认关）列出放行的群。
version: v1.5.6
author: m1181315101-hue
repo: https://github.com/m1181315101-hue/astrbot_plugin_dafeiyu
tags: [群聊, 微信, QQ, 表情包, 复读, 拟人]
support_platforms: [aiocqhttp]
astrbot_version: ">=4.24.1,<5"
